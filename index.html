<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>একটা ছোট্ট Message — ২০ সেপ্টেম্বর ২০২৬</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet">

<style>

:root{
--bg:#090807;
--paper:#e7d3a8;
--ink:#241b12;
--muted:#806b4d;
--gold:#b99a63
}

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
min-height:100vh;
background:
radial-gradient(
circle at 50% 35%,
#29231b 0,
#0e0c09 40%,
#050504 100%
);
color:#ddd;
overflow-x:hidden;
font-family:"Noto Serif Bengali",serif
}

body:before{
content:"";
position:fixed;
inset:0;
z-index:30;
pointer-events:none;
background:
radial-gradient(
ellipse at center,
transparent 42%,
rgba(0,0,0,.72)
)
}


/* =========================
   STARS & DUST
========================= */

.stars,
.dust{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden
}

.star{
position:absolute;
width:2px;
height:2px;
border-radius:50%;
background:#d8c9a4;
opacity:.45;
animation:twinkle 3s infinite alternate
}

.dust span{
position:absolute;
width:3px;
height:3px;
border-radius:50%;
background:#c9aa72;
opacity:.12;
animation:float 12s linear infinite
}

@keyframes twinkle{
to{
opacity:.08;
transform:scale(.4)
}
}

@keyframes float{
to{
transform:
translateY(-110vh)
translateX(30px);
opacity:0
}
}


/* =========================
   MOON
========================= */

.moon{
position:fixed;
top:7%;
right:9%;
width:90px;
height:90px;
border-radius:50%;
background:#ddd0ad;
opacity:.8;
box-shadow:
0 0 50px rgba(220,205,165,.12)
}

.moon:after{
content:"";
position:absolute;
width:90px;
height:90px;
border-radius:50%;
background:#0b0a08;
left:25px;
top:-7px
}


/* =========================
   MAIN
========================= */

.wrap{
position:relative;
z-index:2;
width:min(900px,92%);
margin:auto;
padding:55px 0 70px
}


/* =========================
   HEADER
========================= */

.head{
text-align:center;
margin-bottom:42px
}

.eyebrow{
font:13px "Special Elite";
letter-spacing:4px;
color:#a48b61;
margin-bottom:14px
}

h1{
font:
600 clamp(32px,6vw,60px)
"Noto Serif Bengali";
color:#e4d3ad;
text-shadow:0 3px 20px #000
}

.date{
margin-top:10px;
color:#927b56;
font:
15px "Playfair Display";
letter-spacing:2px
}


/* =========================
   ENVELOPE
========================= */

.envelope{
position:relative;
width:min(620px,94vw);
height:370px;
margin:0 auto;
cursor:pointer;
perspective:1200px;
filter:drop-shadow(0 25px 35px #000)
}

.env{
position:absolute;
inset:55px 0 0;
background:#b89461;
border:1px solid #6e5433;
overflow:hidden
}

.env:before{
content:"";
position:absolute;
inset:0;
background:
repeating-linear-gradient(
0deg,
transparent 0 5px,
rgba(70,45,20,.035) 6px
)
}

.fold1,
.fold2,
.flap{
position:absolute;
background:#c9a875;
z-index:2
}

.fold1{
left:0;
bottom:0;
width:52%;
height:70%;
clip-path:
polygon(
0 100%,
100% 100%,
0 0
)
}

.fold2{
right:0;
bottom:0;
width:52%;
height:70%;
clip-path:
polygon(
100% 100%,
0 100%,
100% 0
)
}

.flap{
top:0;
left:0;
width:100%;
height:58%;
clip-path:
polygon(
0 0,
100% 0,
50% 100%
);
transform-origin:top;
transition:1s;
backface-visibility:hidden;
border-bottom:1px solid #87663e
}

.address{
position:absolute;
left:34px;
top:108px;
z-index:8;
color:#382716;
font:
17px "Noto Serif Bengali";
line-height:1.8
}

.address small{
font-size:12px;
color:#725638
}

.stamp{
position:absolute;
right:28px;
top:76px;
z-index:9;
width:75px;
height:85px;
border:2px dashed #674d2f;
display:grid;
place-items:center;
color:#674d2f;
font:11px "Special Elite";
transform:rotate(4deg);
text-align:center
}

.seal{
position:absolute;
left:50%;
bottom:35px;
transform:translateX(-50%);
z-index:10;
width:55px;
height:55px;
border-radius:50%;
background:#6d3525;
border:3px solid #4c2319;
box-shadow:0 5px 12px #000;
color:#d9b987;
display:grid;
place-items:center;
font-size:23px;
transition:.3s
}

.envelope.open .flap{
transform:rotateX(180deg)
}

.envelope.open .seal{
opacity:0
}

.openhint{
text-align:center;
margin-top:-18px;
color:#816d4d;
font:12px "Special Elite";
letter-spacing:2px;
opacity:.8
}


/* =========================
   LETTER
========================= */

.letter{
display:none;
width:min(760px,94vw);
margin:45px auto 0;
padding:55px 7%;
position:relative;
color:var(--ink);

background:
linear-gradient(
rgba(255,255,255,.06),
rgba(0,0,0,.03)
),
var(--paper);

box-shadow:
0 20px 55px #000,
0 0 0 8px rgba(91,62,31,.12);

transform:translateY(25px);
opacity:0
}

.letter:before{
content:"";
position:absolute;
inset:12px;
border:1px solid rgba(76,51,25,.28);
pointer-events:none
}

.letter:after{
content:"";
position:absolute;
inset:0;
pointer-events:none;
opacity:.25;

background:
repeating-linear-gradient(
0deg,
transparent 0 4px,
rgba(60,35,10,.035) 5px
)
}

.letter.show{
display:block;
animation:paperIn .9s forwards
}

@keyframes paperIn{
to{
transform:none;
opacity:1
}
}

.topline{
position:relative;
z-index:2;
text-align:center;
color:#765c3a;
font:11px "Special Elite";
letter-spacing:3px;
margin-bottom:35px
}

.salute{
position:relative;
z-index:2;
font-size:22px;
margin-bottom:25px;
font-weight:600
}

.content{
position:relative;
z-index:2;
font-size:18px;
line-height:2.05
}

.content p{
margin:0 0 24px
}


/* =========================
   MEMORY DIVIDER
========================= */

.memory{
margin:38px 0;
padding:15px 10px;
text-align:center;

border-top:1px solid #927750;
border-bottom:1px solid #927750;

font:
11px "Special Elite";

letter-spacing:3px;
color:#755b3a
}


/* =========================
   QUOTE
========================= */

.quote{
margin:30px 5%;
padding:20px 25px;

border-left:3px solid #92734b;

font-style:italic;

background:
rgba(116,82,39,.07)
}


/* =========================
   DATE CARD
========================= */

.date-card{
margin:42px auto;
padding:22px 15px;
max-width:430px;

text-align:center;

border:1px solid rgba(108,79,43,.55);

background:
rgba(116,82,39,.06);

box-shadow:
inset 0 0 25px rgba(91,62,31,.06);

color:#654d31
}

.date-card .big{
font:
24px "Playfair Display";
letter-spacing:3px;
margin-bottom:8px
}

.date-card .small{
font:
11px "Special Elite";
letter-spacing:3px;
color:#806545
}


/* =========================
   FINAL
========================= */

.last{
margin-top:40px;
padding-top:25
